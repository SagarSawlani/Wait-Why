<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why this decision? Log in</title>
<style nonce="{{ nonce }}">
  :root { --bg:#0a0f16; --panel:#111823; --line:#293445; --ink:#f3f1ea; --muted:#9ba6b5; --accent:#ffc43d; --on-accent:#211800; --bad:#ff8d85; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; color:var(--ink);
         font:16px/1.5 "Segoe UI",system-ui,sans-serif; background:var(--bg); }
  form { width:100%; max-width:360px; padding:24px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  h1 { margin:0 0 4px; font-size:26px; text-transform:uppercase; letter-spacing:.3px; }
  h1 span { color:var(--accent); }
  p { margin:0 0 18px; color:var(--muted); }
  label { display:block; margin-bottom:6px; font-weight:600; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { width:100%; margin-top:14px; padding:11px; border:0; border-radius:6px; background:var(--accent); color:var(--on-accent);
           font:700 16px inherit; cursor:pointer; }
  .error { margin:12px 0 0; color:var(--bad); }
</style>
</head>
<body>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <h1>Why this <span>decision?</span></h1>
  <p>This demo is private. Enter the password you were sent.</p>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Log in</button>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
</form>
</body>
</html>
